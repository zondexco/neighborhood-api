name: Deploy Backend VPS

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      binary-name: ${{ steps.meta.outputs.binary_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build Linux binary
        id: meta
        run: |
          BINARY_NAME="neighborhood-api-${GITHUB_SHA::7}"
          GOOS=linux GOARCH=amd64 go build -ldflags "-X 'main.Version=${GITHUB_REF_NAME}' -X 'main.BuildTime=$(date -u +%Y-%m-%d_%H:%M:%S)' -X 'main.GitCommit=${GITHUB_SHA::7}'" -o "$BINARY_NAME" ./cmd/api
          echo "binary_name=$BINARY_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: ${{ steps.meta.outputs.binary_name }}
          if-no-files-found: error

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    env:
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      SSH_PASSWORD: ${{ secrets.VPS_PASSWORD }}

    steps:
      - name: Validate SSH auth configuration
        run: |
          if [ -z "$SSH_KEY" ] && [ -z "$SSH_PASSWORD" ]; then
            echo "Missing SSH auth: set VPS_SSH_KEY or VPS_PASSWORD in GitHub secrets."
            exit 1
          fi

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-binary

      - name: Copy binary to VPS (SSH key)
        if: env.SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: ${{ needs.build.outputs.binary-name }}
          target: /tmp

      - name: Copy binary to VPS (password)
        if: env.SSH_KEY == '' && env.SSH_PASSWORD != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: ${{ needs.build.outputs.binary-name }}
          target: /tmp

      - name: Activate deploy and restart service (SSH key)
        if: env.SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            APP_ROOT="/opt/neighborhood-api/main"
            BIN_NAME="${{ needs.build.outputs.binary-name }}"

            sudo mkdir -p "$APP_ROOT/bin"
            sudo mv "/tmp/$BIN_NAME" "$APP_ROOT/bin/$BIN_NAME"
            sudo chmod +x "$APP_ROOT/bin/$BIN_NAME"
            sudo ln -sfn "$APP_ROOT/bin/$BIN_NAME" "$APP_ROOT/bin/current"
            sudo systemctl restart neighborhood-api
            sudo systemctl status neighborhood-api --no-pager

      - name: Activate deploy and restart service (password)
        if: env.SSH_KEY == '' && env.SSH_PASSWORD != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            APP_ROOT="/opt/neighborhood-api/main"
            BIN_NAME="${{ needs.build.outputs.binary-name }}"

            sudo mkdir -p "$APP_ROOT/bin"
            sudo mv "/tmp/$BIN_NAME" "$APP_ROOT/bin/$BIN_NAME"
            sudo chmod +x "$APP_ROOT/bin/$BIN_NAME"
            sudo ln -sfn "$APP_ROOT/bin/$BIN_NAME" "$APP_ROOT/bin/current"
            sudo systemctl restart neighborhood-api
            sudo systemctl status neighborhood-api --no-pager
